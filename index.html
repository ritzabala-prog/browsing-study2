<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browsing task</title>
<style>
  body{margin:0;font-family:Georgia,serif;color:#222;background:#fff;line-height:1.6}
  .hidden{display:none}
  .wrap{max-width:680px;margin:0 auto;padding:24px 20px 160px}
  h1{font-size:28px;line-height:1.25}
  .site-header{background:#14213d;color:#fff;padding:14px 20px;font-family:Arial,sans-serif;font-weight:bold;letter-spacing:1px}
  .tag{font-family:Arial,sans-serif;font-size:12px;color:#c1121f;text-transform:uppercase;letter-spacing:1px}
  .box{font-family:Arial,sans-serif;max-width:560px;margin:40px auto;padding:0 20px}
  button{font-family:Arial,sans-serif;font-size:16px;padding:12px 18px;border-radius:6px;border:1px solid #14213d;background:#fff;color:#14213d;cursor:pointer;margin:4px 6px 4px 0}
  button.main{background:#14213d;color:#fff}
  button.lang{display:block;width:100%;text-align:left;margin:8px 0}
  #stopBtn{position:fixed;top:8px;right:8px;z-index:50;font-size:13px;padding:7px 10px;background:#f1f1f1}
  #banner{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid #14213d;box-shadow:0 -4px 16px rgba(0,0,0,.2);padding:16px 20px;font-family:Arial,sans-serif;font-size:15px;z-index:20}
  #banner .inner{max-width:680px;margin:0 auto}
  #prefs label{display:block;margin:6px 0}
  #feed{font-family:"Courier New",monospace;background:#111;color:#7CFC9A;padding:16px;border-radius:6px;min-height:260px;font-size:14px}
  #feed div{margin:3px 0}
  .note{font-size:14px;color:#555}
</style>
</head>
<body>

<button id="stopBtn" class="hidden" onclick="show('exit')" data-t="stop"></button>

<!-- SCREEN 0: language selection -->
<div id="lang" class="screen hidden">
  <div class="box">
    <h1>Choose your language<br>Elige tu idioma<br>Escolha o idioma<br>Kies je taal<br>Sprache wählen</h1>
    <button class="lang" onclick="setLang('es')">Español</button>
    <button class="lang" onclick="setLang('pt')">Português</button>
    <button class="lang" onclick="setLang('en')">English</button>
    <button class="lang" onclick="setLang('nl')">Nederlands</button>
    <button class="lang" onclick="setLang('de')">Deutsch</button>
  </div>
</div>

<!-- SCREEN 1: instructions -->
<div id="intro" class="screen hidden">
  <div class="box">
    <h1 data-t="introTitle"></h1>
    <p data-t="intro1"></p>
    <p data-t="intro2"></p>
    <button class="main" onclick="show('news')" data-t="start"></button>
  </div>
</div>

<!-- SCREEN 2: mock news site with cookie banner -->
<div id="news" class="screen hidden">
  <div class="site-header">THE DAILY HERALD</div>
  <div class="wrap">
    <div class="tag" data-t="tag"></div>
    <h1 data-t="artTitle"></h1>
    <p data-t="art1"></p>
    <p data-t="art2"></p>
    <p data-t="art3"></p>
    <p data-t="art4"></p>
  </div>

  <div id="banner">
    <div class="inner">
      <p><strong data-t="bannerTitle"></strong><br><span data-t="bannerText"></span></p>
      <div id="prefs" class="hidden">
        <label><input type="checkbox"> <span data-t="analytics"></span></label>
        <label><input type="checkbox"> <span data-t="advertising"></span></label>
        <label><input type="checkbox"> <span data-t="social"></span></label>
        <label><input type="checkbox"> <span data-t="personalisation"></span></label>
        <button class="main" onclick="savePrefs()" data-t="save"></button>
      </div>
      <div id="choices">
        <button class="main" onclick="choose(true)" data-t="acceptAll"></button>
        <button onclick="document.getElementById('prefs').classList.remove('hidden');document.getElementById('choices').classList.add('hidden')" data-t="customise"></button>
        <button class="main" onclick="choose(false)" data-t="rejectAll"></button>
      </div>
    </div>
  </div>
</div>

<!-- SCREEN 3: consequence simulation -->
<div id="consequence" class="screen hidden">
  <div class="box">
    <h1 id="cTitle"></h1>
    <div id="feed"></div>
    <p class="note" data-t="simNote"></p>
  </div>
</div>

<!-- SCREEN 4: debrief -->
<div id="debrief" class="screen hidden">
  <div class="box">
    <h1 data-t="debTitle"></h1>
    <p data-t="deb1"></p>
    <p data-t="deb2"></p>
    <p><strong data-t="deb3"></strong></p>
    <ul>
      <li data-t="tip1"></li>
      <li data-t="tip2"></li>
      <li data-t="tip3"></li>
    </ul>
    <p><strong data-t="close"></strong></p>
  </div>
</div>

<!-- SCREEN 5: early exit -->
<div id="exit" class="screen hidden">
  <div class="box">
    <h1 data-t="exitTitle"></h1>
    <p data-t="exit1"></p>
  </div>
</div>

  var lang = "en";

  function applyLang(){
    var d = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach(function(el){
      el.textContent = d[el.getAttribute("data-t")];
    });
  }

  function setLang(code){
    lang = code;
    applyLang();
    show("intro");
  }

  function show(id){
    document.querySelectorAll(".screen").forEach(function(s){ s.classList.add("hidden"); });
    document.getElementById(id).classList.remove("hidden");
    var hideStop = (id === "exit" || id === "debrief" || id === "lang");
    document.getElementById("stopBtn").classList.toggle("hidden", hideStop);
    window.scrollTo(0, 0);
  }

  function savePrefs(){
    var any = false;
    document.querySelectorAll("#prefs input").forEach(function(b){ if(b.checked) any = true; });
    choose(any);
  }

  // Reads only from the participant's own browser. Nothing is sent or stored.
  function detect(){
    var ua = navigator.userAgent, b = "?", o = "?";
    if(/Edg\//.test(ua)) b = "Edge"; else if(/OPR\//.test(ua)) b = "Opera";
    else if(/Firefox\//.test(ua)) b = "Firefox"; else if(/Chrome\//.test(ua)) b = "Chrome";
    else if(/Safari\//.test(ua)) b = "Safari";
    if(/Windows/.test(ua)) o = "Windows"; else if(/Android/.test(ua)) o = "Android";
    else if(/iPhone|iPad/.test(ua)) o = "iOS"; else if(/Mac OS X/.test(ua)) o = "macOS";
    else if(/Linux/.test(ua)) o = "Linux";
    return b + " / " + o;
  }

  function choose(accepted){
    var d = T[lang];
    document.getElementById("banner").classList.add("hidden");
    document.getElementById("cTitle").textContent = accepted ? d.cTitleAcc : d.cTitleRej;

    var tz = "?";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e) {}

    var lines = d.feed.map(function(l){
      return l.replace("%b", detect())
              .replace("%l", navigator.language)
              .replace("%s", screen.width + " x " + screen.height)
              .replace("%t", tz);
    });

    show("consequence");
    var feed = document.getElementById("feed");
    feed.innerHTML = "";
    var i = 0;
    var timer = setInterval(function(){
      if(i < lines.length){
        var div = document.createElement("div");
        div.textContent = "> " + lines[i];
        feed.appendChild(div);
        i++;
      } else {
        clearInterval(timer);
        setTimeout(function(){ show("debrief"); }, 1500);
      }
    }, 450);
  }

  // Start: use ?lang=xx from the link if present, otherwise show the selector
  (function(){
    var p = "";
    try { p = new URLSearchParams(window.location.search).get("lang") || ""; } catch(e) {}
    p = p.toLowerCase();
    if(T[p]){ setLang(p); } else { show("lang"); }
  })();
</script>
</body>
